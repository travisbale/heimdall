name: Release

# Cut a release by pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`):
# build the image, push it to Artifact Registry, and deploy to Cloud Run.
on:
  push:
    tags: ['v*']

# Workload Identity Federation authenticates via a short-lived OIDC token — no stored key.
permissions:
  # write, so the run can publish a GitHub release for the tag it just shipped.
  contents: write
  id-token: write

jobs:
  release:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: heimdall
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.AR_REPO }}/heimdall
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # The default buildx driver can't export a cache, so `cache-to: type=gha` below
      # fails without this — it swaps in the docker-container driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --image "${IMAGE}:${GITHUB_REF_NAME}"

      # A tag deploys but leaves no record of what went out. The notes are generated from
      # the commits since the previous tag; the annotated tag message becomes the summary
      # above them. The image digest is named so a release identifies the exact artifact
      # running in production, not just the commit it was built from.
      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Deployed to Cloud Run as `${{ env.IMAGE }}:${{ github.ref_name }}`.
