name: Release

# Cut a release by pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`):
# build the image, push it to Artifact Registry, and deploy to Cloud Run.
#
# The checks run here rather than relying on ci.yml, so a tag can never deploy something that
# does not pass them — ci.yml runs on pushes and says nothing about the commit a tag names.
on:
  push:
    tags: ['v*']

# Workload Identity Federation authenticates via a short-lived OIDC token — no stored key.
permissions:
  # write, so the run can publish a GitHub release for the tag it just shipped.
  contents: write
  id-token: write

jobs:
  release:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: heimdall
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.AR_REPO }}/heimdall
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Ahead of the cloud credentials below, so a commit that fails these never reaches a
      # step holding them.
      - name: Verify
        run: |
          make fmt
          if ! git diff --exit-code; then
            echo "Code is not formatted. Run 'make fmt' and commit the changes."
            exit 1
          fi
          make lint
          make unit

      - name: Start test infrastructure
        run: make test-setup

      # The migrations run against a live database here, which is the only check that a
      # release applies them at all.
      - name: Run integration tests
        run: make integration

      - name: Upload heimdall logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: heimdall-release-logs
          path: test/heimdall.log
          if-no-files-found: ignore

      - name: Tear down test infrastructure
        if: always()
        run: make test-teardown

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # The default buildx driver can't export a cache, so `cache-to: type=gha` below
      # fails without this — it swaps in the docker-container driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # The schema moves first, and a failure stops the release here with the revision that is
      # serving left alone. The job itself is defined in the infrastructure repo, as the service is.
      - name: Migrate the database
        run: |
          gcloud run jobs update "${SERVICE}-migrate" \
            --project "$PROJECT" --region "$REGION" \
            --image "${IMAGE}:${GITHUB_REF_NAME}"
          gcloud run jobs execute "${SERVICE}-migrate" \
            --project "$PROJECT" --region "$REGION" --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --image "${IMAGE}:${GITHUB_REF_NAME}"

      # A tag deploys but leaves no record of what went out. The notes are generated from
      # the commits since the previous tag; the annotated tag message becomes the summary
      # above them. The image digest is named so a release identifies the exact artifact
      # running in production, not just the commit it was built from.
      - name: Publish the release
        # Pinned to a commit, unlike the actions above it: those are published by GitHub,
        # Docker and Google, while this one is an individual's. A moved tag would inherit
        # this job's write token and, in the service repos, its cloud credentials.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          body: |
            Deployed to Cloud Run as `${{ env.IMAGE }}:${{ github.ref_name }}`.
