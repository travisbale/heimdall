name: Release

# Cut a release by pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`):
# build the image, push it to Artifact Registry, migrate, and deploy to Cloud Run.
on:
  push:
    tags: ['v*']

# Workload Identity Federation authenticates via a short-lived OIDC token — no stored key.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: heimdall
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.AR_REPO }}/heimdall
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run database migrations
        run: |
          gcloud run jobs deploy "${SERVICE}-migrate" \
            --project "$PROJECT" --region "$REGION" \
            --image "${IMAGE}:${GITHUB_REF_NAME}" \
            --args migrate,up \
            --set-secrets DATABASE_URL=heimdall-database-url:latest \
            --max-retries 1 --task-timeout 300s
          gcloud run jobs execute "${SERVICE}-migrate" \
            --project "$PROJECT" --region "$REGION" --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --image "${IMAGE}:${GITHUB_REF_NAME}"
